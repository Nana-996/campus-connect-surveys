name: Build

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      # bun.lock is the lockfile Lovable keeps in sync on every dependency change.
      - name: Install
        run: bun install --frozen-lockfile

      - name: Type check
        run: npx tsc --noEmit

      - name: Production build
        run: npm run build
